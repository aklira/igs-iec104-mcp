# The example of IMPLEMENTATION.md §8, with the point kind written as `kind`, as the definitions name
# it. The client interrogates, checks the value, the station updates it, and the client observes it.
schema_version: 1
name: interrogation-and-spontaneous-update
bench: basic-pair
steps:
  - action: wait_transfer_started
    client: client-1
    timeout: 10s
  - action: general_interrogation
    client: client-1
    timeout: 5s
  - action: assert_point
    client: client-1
    address: 100
    kind: float
    value: 12.5
    tolerance: 0.001
  - action: update_point
    server: server-1
    address: 100
    value: 18.0
  - action: expect_point
    client: client-1
    address: 100
    kind: float
    value: 18.0
    tolerance: 0.001
    timeout: 2s
