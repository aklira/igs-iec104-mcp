# A client and a station on one network. The station serves IOA 100, a short floating point measured
# value that starts at 12.5 (IMPLEMENTATION.md §8).
schema_version: 1
name: basic-pair
networks:
  - name: lan
instances:
  - name: client-1
    role: client
    network: lan
    common_address: 1
  - name: server-1
    role: server
    network: lan
    common_address: 1
    points:
      - address: 100
        kind: float
        value: 12.5
connections:
  - client: client-1
    server: server-1
