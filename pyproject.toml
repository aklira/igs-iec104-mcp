[project]
name = "igs-iec104-mcp"
version = "0.1.0"
description = "MCP server that orchestrates IEC 60870-5-104 test benches built on igs-iec104"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2,<8",
    "httpx>=0.28.1,<1",
    "mcp>=2.3.0,<3",
    "pydantic>=2.14,<3",
    "ruamel-yaml>=0.19.1,<0.20",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

# jsonschema ships no type stubs, and types-jsonschema is not a listed dependency: the tests that
# use it are typed by hand (DECISIONS.md D-009).
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "mypy>=2.4,<3",
    "openapi-spec-validator>=0.7,<1",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
]
