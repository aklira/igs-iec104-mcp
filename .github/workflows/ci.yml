# Runs the standard gate of IMPLEMENTATION.md §2 on Linux, the Rust runtime's gate, and the runtime
# image build. The Docker integration tests are added with task D1.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-gate:
    name: Python gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python (from .python-version)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Licence policy
        run: uv run python scripts/check_licences.py

  rust-gate:
    name: Rust gate (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Deny
        run: cargo deny check

  image:
    name: Runtime image (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build --file docker/runtime.Dockerfile --tag igs-iec104-runtime:ci runtime

      - name: Start the runtime, which prints its banner and exits
        run: |
          docker run --rm igs-iec104-runtime:ci | tee banner.txt
          grep -q '^igs-iec104-runtime ' banner.txt

      - name: Record the image ID
        run: docker image inspect --format '{{.Id}}' igs-iec104-runtime:ci | tee image-id.txt

      - name: Publish the image ID
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-id
          path: image-id.txt

  integration:
    name: Milestone 1 integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Build the runtime
        working-directory: runtime
        run: cargo build --locked --package igs-iec104-runtime

      - name: Install uv and Python (from .python-version)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Build the runtime, relay, and independent peer images for the Docker tests
        run: |
          docker build --file docker/runtime.Dockerfile --tag igs-iec104-runtime:ci runtime
          echo "IGS_RUNTIME_IMAGE=$(docker image inspect --format '{{.Id}}' igs-iec104-runtime:ci)" >> "$GITHUB_ENV"
          docker build --file docker/relay.Dockerfile --tag igs-iec104-relay:ci docker
          echo "IGS_RELAY_IMAGE=$(docker image inspect --format '{{.Id}}' igs-iec104-relay:ci)" >> "$GITHUB_ENV"
          docker build --file docker/independent/Dockerfile --tag igs-iec104-j60870:ci docker/independent
          echo "IGS_INDEPENDENT_IMAGE=$(docker image inspect --format '{{.Id}}' igs-iec104-j60870:ci)" >> "$GITHUB_ENV"

      - name: Run the integration tests
        env:
          IGS_RUNTIME_BINARY: ${{ github.workspace }}/runtime/target/debug/igs-iec104-runtime
        run: uv run pytest tests/integration

  install:
    # The installer as an agent runs it (docs/install-agent.md), on a runner that holds nothing
    # from an earlier run: no action cache, no image, and no state. Docker is the runner's
    # engine. Podman is tested on the maintainer's WSL2 host (docs/platform-matrix.md).
    name: Installation on a fresh checkout (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set the paths of this run, outside the checkout
        run: |
          echo "XDG_STATE_HOME=$RUNNER_TEMP/state" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$RUNNER_TEMP/igs-project" >> "$GITHUB_ENV"

      - name: Install the OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install uv and Python (from .python-version), without a cache
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false

      - name: The plan changes nothing
        run: |
          scripts/install.sh --dry-run --engine docker --project-dir "$PROJECT_DIR" --client claude
          test ! -e "$PROJECT_DIR"
          test ! -e "$XDG_STATE_HOME/igs-iec104-mcp/install.json"

      - name: Install the server
        run: |
          set -o pipefail
          scripts/install.sh --engine docker --project-dir "$PROJECT_DIR" | tee first.txt

      - name: Install again, and nothing changes
        run: |
          set -o pipefail
          state="$XDG_STATE_HOME/igs-iec104-mcp/install.json"
          before=$(sha256sum "$state")
          scripts/install.sh --engine docker --project-dir "$PROJECT_DIR" | tee second.txt
          grep -q "state unchanged" second.txt
          test "$before" = "$(sha256sum "$state")"

      - name: The state holds identities and absolute paths, never tags
        run: |
          python3 -c '
          import json, os, re
          state = json.load(open(os.path.join(os.environ["XDG_STATE_HOME"], "igs-iec104-mcp", "install.json")))
          assert state["engine"] == "docker", state
          for key in ("runtime_image", "relay_image"):
              assert re.fullmatch(r"sha256:[0-9a-f]{64}", state[key]), state
          assert os.path.isabs(state["repository"]) and os.path.isabs(state["project_dir"]), state
          print(state)
          '

      - name: The server answers its handshake, and validates the example bench
        run: PYTHONPATH=src uv run --locked python -m igs_iec104_mcp.doctor --server-only

      - name: Run the example bench, and find nothing left on the engine
        run: |
          set -o pipefail
          PYTHONPATH=src uv run --locked python -m igs_iec104_mcp.doctor --engine docker --run-bench --json | tee bench.json
          python3 -c '
          import json
          statuses = {check["name"]: check["status"] for check in json.load(open("bench.json"))["checks"]}
          assert statuses["bench-run"] == "ok", statuses
          assert statuses["bench-cleanup"] == "ok", statuses
          '
          test -z "$(docker ps -aq --filter label=dev.igs-iec104.mcp.managed=true)"
          test -z "$(docker network ls -q --filter label=dev.igs-iec104.mcp.managed=true)"

      - name: The registration tests (stub client CLIs)
        run: uv run pytest tests/integration/test_install.py -k registration -v
