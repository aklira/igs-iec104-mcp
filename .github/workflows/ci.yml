# Runs the Python part of the standard gate of IMPLEMENTATION.md §2 on Linux.
# The Rust part of the gate and the Docker tests are added with tasks B2 and D1.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-gate:
    name: Python gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python (from .python-version)
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit
