# Runs the standard gate of IMPLEMENTATION.md §2 on Linux, the Rust runtime's gate, and the runtime
# image build. The Docker integration tests are added with task D1.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-gate:
    name: Python gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python (from .python-version)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Licence policy
        run: uv run python scripts/check_licences.py

  rust-gate:
    name: Rust gate (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Deny
        run: cargo deny check

  image:
    name: Runtime image (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build --file docker/runtime.Dockerfile --tag igs-iec104-runtime:ci runtime

      - name: Start the runtime, which prints its banner and exits
        run: |
          docker run --rm igs-iec104-runtime:ci | tee banner.txt
          grep -q '^igs-iec104-runtime ' banner.txt

      - name: Record the image ID
        run: docker image inspect --format '{{.Id}}' igs-iec104-runtime:ci | tee image-id.txt

      - name: Publish the image ID
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-id
          path: image-id.txt

  integration:
    name: Milestone 1 integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Build the runtime
        working-directory: runtime
        run: cargo build --locked --package igs-iec104-runtime

      - name: Install uv and Python (from .python-version)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Build the runtime and relay images for the Docker tests
        run: |
          docker build --file docker/runtime.Dockerfile --tag igs-iec104-runtime:ci runtime
          echo "IGS_RUNTIME_IMAGE=$(docker image inspect --format '{{.Id}}' igs-iec104-runtime:ci)" >> "$GITHUB_ENV"
          docker build --file docker/relay.Dockerfile --tag igs-iec104-relay:ci docker
          echo "IGS_RELAY_IMAGE=$(docker image inspect --format '{{.Id}}' igs-iec104-relay:ci)" >> "$GITHUB_ENV"

      - name: Run the integration tests
        env:
          IGS_RUNTIME_BINARY: ${{ github.workspace }}/runtime/target/debug/igs-iec104-runtime
        run: uv run pytest tests/integration
