openapi: 3.1.0
info:
  title: igs-iec104-runtime control API
  version: 1.0.0
  description: >-
    The control API of one runtime, used by the controller only (IMPLEMENTATION.md §3). A runtime
    runs as a client of one station or as a station. Every route needs the control token. A request
    to the client is acknowledged when it is queued (202); its outcome comes as events. The events
    are described by events.schema.json, which carries the same contract version.
servers:
  - url: http://{control_address}
    description: The control address the runtime reports on readiness.
    variables:
      control_address:
        default: 127.0.0.1:0
        description: The address the runtime listens on, as it reported it.
security:
  - ControlToken: []
paths:
  /v1/ready:
    get:
      operationId: ready
      summary: "Readiness: the role, the control address, and the state of the role."
      responses:
        "200":
          description: The runtime is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/transfer/start:
    post:
      operationId: startTransfer
      summary: Start the data transfer of the client (STARTDT act).
      responses:
        "202":
          description: The request is queued. Its outcome comes as events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WrongRole"
        "503":
          description: The request is not queued, because the client has stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
  /v1/interrogation/general:
    post:
      operationId: generalInterrogation
      summary: Request a general interrogation of the station (C_IC_NA_1, QOI 20).
      responses:
        "202":
          description: The request is queued. Its outcome comes as events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WrongRole"
        "503":
          description: The request is not queued, because the client has stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
  /v1/events:
    get:
      operationId: events
      summary: The events of the client after a sequence number, oldest first.
      parameters:
        - name: after
          in: query
          required: false
          description: Zero, or the last sequence number the reader has seen.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The events kept after the number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WrongRole"
  /v1/points:
    get:
      operationId: listPoints
      summary: The points of the station, with their current values.
      responses:
        "200":
          description: The points, by address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/WrongRole"
  /v1/points/{address}:
    parameters:
      - $ref: "#/components/parameters/Address"
    get:
      operationId: getPoint
      summary: One point of the station, with its current value.
      responses:
        "200":
          description: The point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Point"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoPoint"
        "409":
          $ref: "#/components/responses/WrongRole"
    post:
      operationId: updatePoint
      summary: Set the value of a point. The station queues a spontaneous change when it differs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointUpdate"
      responses:
        "200":
          description: The value is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointUpdated"
        "400":
          description: The value does not fit the kind of the point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoPoint"
        "409":
          $ref: "#/components/responses/WrongRole"
        "500":
          description: The value could not be published, or the clock is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    ControlToken:
      type: http
      scheme: bearer
      description: The control token of the runtime, read from its token file.
  parameters:
    Address:
      name: address
      in: path
      required: true
      description: The information object address of the point, 1 to 16777215.
      schema:
        type: integer
        minimum: 1
        maximum: 16777215
  responses:
    Unauthorized:
      description: The control token is missing or wrong.
      headers:
        WWW-Authenticate:
          description: Bearer
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WrongRole:
      description: The route belongs to the other role (a client route on a station, or the reverse).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoPoint:
      description: No point of the station has this address.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Ready:
      description: The readiness of the runtime, by role.
      oneOf:
        - $ref: "#/components/schemas/ClientReady"
        - $ref: "#/components/schemas/StationReady"
    ClientReady:
      type: object
      additionalProperties: false
      required: [ready, role, control_address, contract, connection, transfer]
      properties:
        ready:
          const: true
        role:
          const: client
        control_address:
          type: string
        contract:
          $ref: "#/components/schemas/ContractVersion"
        connection:
          type: string
          enum: [down, up]
        transfer:
          $ref: "events.schema.json#/$defs/TransferState"
    StationReady:
      type: object
      additionalProperties: false
      required: [ready, role, control_address, contract, listen_address, points]
      properties:
        ready:
          const: true
        role:
          const: station
        control_address:
          type: string
        contract:
          $ref: "#/components/schemas/ContractVersion"
        listen_address:
          type: string
        points:
          type: integer
          minimum: 0
    ContractVersion:
      type: string
      description: The version of this contract, the same as the version of events.schema.json.
      const: 1.0.0
    Accepted:
      type: object
      additionalProperties: false
      required: [accepted, error]
      properties:
        accepted:
          type: boolean
        error:
          type: ["string", "null"]
    EventsBody:
      type: object
      additionalProperties: false
      required: [events, first_seq, last_seq, dropped]
      properties:
        events:
          type: array
          items:
            $ref: "events.schema.json#/$defs/Event"
        first_seq:
          description: The oldest sequence number kept, or null when none is kept. A reader that asked after n has missed events when n + 1 is below this number.
          type: ["integer", "null"]
          minimum: 1
        last_seq:
          type: integer
          minimum: 0
        dropped:
          description: The events dropped because the log was full.
          type: integer
          minimum: 0
    PointKind:
      type: string
      enum: [single, double, normalized, scaled, float]
    Point:
      type: object
      additionalProperties: false
      required: [address, kind, stamped, value]
      properties:
        address:
          type: integer
          minimum: 1
          maximum: 16777215
        kind:
          $ref: "#/components/schemas/PointKind"
        stamped:
          type: boolean
        value:
          description: "The value in the form of the kind: a boolean (single), off, on, intermediate or indeterminate (double), or a number (normalized, scaled, float)."
          anyOf:
            - type: boolean
            - type: string
              enum: [off, on, intermediate, indeterminate]
            - type: number
    PointList:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/Point"
    PointUpdate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          description: The new value, in the form of the kind of the point (see Point).
    PointUpdated:
      type: object
      additionalProperties: false
      required: [address, value, queued]
      properties:
        address:
          type: integer
          minimum: 1
          maximum: 16777215
        value:
          description: The value stored, in the form of the kind of the point.
        queued:
          description: True when the value changed, so that a spontaneous ASDU was queued.
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
